<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search for networks again?</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f5;
    color: #18181b;
    line-height: 1.5;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 2rem 1.25rem; }
  h1 { font-size: 1.4rem; }
  .note {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #7c2d12;
    padding: 0.85rem 0.95rem;
    border-radius: 0.6rem;
    margin: 1.25rem 0;
  }
  button {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.85rem;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: 0;
    border-radius: 0.6rem;
  }
  button:active { background: #1d4ed8; }
  .cancel {
    display: block;
    text-align: center;
    margin-top: 1.25rem;
    color: #52525b;
    font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #18181b; color: #f4f4f5; }
    .note { background: #2a1a0e; border-color: #7c2d12; color: #fdba74; }
    .cancel { color: #a1a1aa; }
  }
</style>
</head>
<body>
<main>
  <h1>Search for networks again?</h1>
  <p class="note">
    The frame will restart its setup Wi-Fi (<strong>{{.APSSID}}</strong>) to
    look for nearby networks. Your phone will be disconnected while it
    searches. When the frame shows its QR code again, scan it to reconnect
    and see the updated list.
  </p>
  <form method="POST" action="/rescan">
    <button type="submit">Restart Wi-Fi search</button>
  </form>
  <a class="cancel" href="/">Cancel</a>
</main>
</body>
</html>
