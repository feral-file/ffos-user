<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Searching for networks…</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f5;
    color: #18181b;
    line-height: 1.5;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 2rem 1.25rem; }
  h1 { font-size: 1.4rem; }
  .note {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e40af;
    padding: 0.85rem 0.95rem;
    border-radius: 0.6rem;
    margin: 1.25rem 0;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #18181b; color: #f4f4f5; }
    .note { background: #10233f; border-color: #1e3a8a; color: #93c5fd; }
  }
</style>
</head>
<body>
<main>
  <h1>Searching for networks…</h1>
  <p class="note">
    The frame is restarting its setup Wi-Fi to look for nearby networks. Your
    phone will be disconnected from <strong>{{.APSSID}}</strong> in a moment.
    When the frame shows its QR code again, scan it to reconnect and see the
    updated list.
  </p>
</main>
</body>
</html>
