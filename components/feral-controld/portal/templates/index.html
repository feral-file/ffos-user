<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Computer setup — Choose a Wi-Fi network</title>
<link rel="stylesheet" href="/setup.css">
</head>
<body>
<main>
  <p class="brand">Feral File · Art Computer</p>
  <h1>Choose a Wi-Fi network</h1>

  {{if .LastStatus}}
  <div class="status status-{{.LastStatus.State}}">
    {{.LastStatus.Message}}
  </div>
  {{end}}

  <form class="connect" method="POST" action="/connect">
    {{if .SSIDs}}
    <label for="ssid">Wi-Fi network</label>
    <select id="ssid" name="ssid">
      <option value="" selected disabled>Select a network…</option>
      {{range .SSIDs}}<option value="{{.}}">{{.}}</option>{{end}}
      {{- /* This non-empty sentinel identifies the manual branch. It exceeds
           the maximum SSID length and is converted back to an empty manual
           value server-side, so it cannot collide with a real network. */}}
      <option value="{{.ManualSSIDOption}}" data-manual>Other network…</option>
    </select>

    <div id="manual-entry">
      <label for="ssid-manual">Or type a network name</label>
      <input id="ssid-manual" name="ssid_manual" type="text" autocomplete="off"
             autocapitalize="none" placeholder="Leave empty to use the list above">

      <label class="check" for="hidden">
        <input id="hidden" name="hidden" type="checkbox" value="1">
        <span>This is a hidden network</span>
      </label>
    </div>
    {{else}}
    <label for="ssid-manual">Wi-Fi network</label>
    <input id="ssid-manual" name="ssid_manual" type="text" autocomplete="off"
           autocapitalize="none" placeholder="Network name">

    <label class="check" for="hidden">
      <input id="hidden" name="hidden" type="checkbox" value="1">
      <span>This is a hidden network</span>
    </label>
    {{end}}

    <label for="password">Wi-Fi password</label>
    <div class="pwfield">
      <input id="password" name="password" type="password" autocomplete="off"
             aria-describedby="password-help">
      <button type="button" id="password-toggle" class="pwtoggle"
              aria-pressed="false" aria-label="Show password" hidden>
        {{- /* The icon shows the tap's ACTION, following the majority
             convention (Material/Android, Edge): open eye while concealed
             ("tap to reveal"), slashed eye while revealed. */}}
        <svg id="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" hidden>
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    {{- /* Renders in BOTH form shapes — picker and empty-scan manual entry —
         so it must not say "selected". */}}
    <p id="password-help" class="field-hint">
      Use that network's own password—not the setup password.
    </p>

    <button type="submit" class="primary">Connect</button>
  </form>

  <form method="GET" action="/rescan">
    <button type="submit" class="secondary">Network not listed?</button>
  </form>
</main>
<script>
  // Collapse manual entry behind the picker's "Other network…" option.
  // Progressive enhancement: the markup ships fully visible, so a captive
  // mini-browser with scripting disabled keeps today's dual-source form;
  // the server accepts either shape unchanged. The reveal rewrites the
  // label/placeholder copy ("Or type a network name" only reads right when
  // the field sits beside the picker) and applies branch-specific validation.
  // The base HTML deliberately leaves the picker optional so a no-JS phone
  // can submit the always-visible manual field; the server rejects an empty
  // submission in either mode.
  (function () {
    var select = document.getElementById('ssid');
    var manual = document.getElementById('manual-entry');
    var input = document.getElementById('ssid-manual');
    if (!select || !manual || !input) return;
    var label = manual.querySelector('label[for="ssid-manual"]');
    var sync = function (viaChange) {
      var choice = select.options[select.selectedIndex];
      var other = !!choice && choice.hasAttribute('data-manual');
      manual.hidden = !other;
      select.required = !other;
      input.required = other;
      if (other) {
        if (label) label.textContent = 'Network name';
        input.placeholder = "Type the network's name";
        if (viaChange) input.focus();
      } else {
        // A typed name outranks the picker server-side, so a stale value
        // left behind a re-hidden field would silently override the pick.
        input.value = '';
      }
    };
    select.addEventListener('change', function () { sync(true); });
    sync(false);
  })();

  // Show/hide toggle for the Wi-Fi password, an icon-only button. The icon
  // shows the tap's action — open eye while concealed ("tap to reveal"),
  // slashed eye while revealed; aria-label carries the accessible name.
  // Progressive enhancement: the button ships [hidden] so a captive
  // mini-browser with scripting disabled just gets a plain password field.
  (function () {
    var input = document.getElementById('password');
    var toggle = document.getElementById('password-toggle');
    var eye = document.getElementById('pw-eye');
    var eyeOff = document.getElementById('pw-eye-off');
    if (!input || !toggle || !eye || !eyeOff) return;
    toggle.hidden = false;
    // Attribute API, not the .hidden property: the icons are SVG elements,
    // and `hidden` is an HTMLElement property — on an SVGElement assigning
    // it creates an inert expando and the attribute never changes.
    var show = function (el, on) {
      if (on) { el.removeAttribute('hidden'); } else { el.setAttribute('hidden', ''); }
    };
    toggle.addEventListener('click', function () {
      var reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      show(eye, !reveal);
      show(eyeOff, reveal);
      toggle.setAttribute('aria-pressed', reveal ? 'true' : 'false');
      toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    });
  })();

  // Hand-off watcher. On an iPhone the setup link the on-screen QR opens
  // lands in Safari, and iOS then presents its own captive sheet ON TOP of
  // Safari (Safari coming forward is the "Wi-Fi app in front" condition
  // that releases the sheet — feral-file#3515). The user completes setup in
  // the sheet, which closes itself when the hotspot drops, and this Safari
  // page would otherwise be left on an untouched picker. So while this page
  // is idle it polls /status; once a join has started anywhere (the sheet,
  // another device), or the device stops answering, it becomes the hand-off
  // screen — and then keeps watching: the daemon tears the hotspot down
  // BEFORE the join is attempted, so a wrong password re-raises it, and the
  // hand-off must not strand that user. When the device answers again in
  // any state but "joining", the page reloads into the picker (with the
  // failure banner the server renders). A failed status while still on the
  // form keeps the form. Progressive enhancement — no script, no watcher.
  //
  // Rules the 2026-09-07 trials and the outside audit forced:
  // - The first poll runs on load, while Safari is still in front (iOS
  //   freezes a backgrounded tab's timers). There is no "answered" gate:
  //   this page was served by the device, so it has already answered.
  // - Every poll is aborted after 1.5 s: once the phone is back on its
  //   home network a fetch to the hotspot address hangs instead of failing.
  // - Only a NETWORK failure is a miss. An HTTP error (the 429 the
  //   in-flight cap returns, a 5xx) proves the device is there and resets
  //   the count — three "busy" answers must not delete unsent credentials.
  // - Misses never hand off while the form holds input or focus: an
  //   Android Chrome or macOS user typing in this very page through a
  //   transient drop keeps their form. A started join elsewhere still
  //   hands off — that is the sheet case this exists for.
  // - The page becoming visible again (the sheet closed) polls at once.
  // - Polls carry X-Setup-Watcher so the daemon does not count this
  //   script as an attached device talking (portal.Config.TrafficObserved).
  (function () {
    var main = document.querySelector('main');
    if (!main || !window.fetch) return;
    var misses = 0;
    var inflight = false;
    var handedOff = false;
    var formTouched = function () {
      var pw = document.getElementById('password');
      var manual = document.getElementById('ssid-manual');
      var select = document.getElementById('ssid');
      if ((pw && pw.value) || (manual && manual.value)) return true;
      if (select && select.selectedIndex > 0) return true;
      var active = document.activeElement;
      return !!active && active !== document.body && main.contains(active);
    };
    var handOff = function () {
      handedOff = true;
      while (main.firstChild) main.removeChild(main.firstChild);
      var brand = document.createElement('p');
      brand.className = 'brand';
      brand.textContent = 'Feral File · Art Computer';
      var h1 = document.createElement('h1');
      h1.textContent = 'Setup continues on your Art Computer';
      var note = document.createElement('p');
      note.className = 'note note-info';
      note.textContent = 'Watch its screen \u2014 it shows the progress. You can close this page.';
      main.appendChild(brand);
      main.appendChild(h1);
      main.appendChild(note);
      setTimeout(watchForReturn, 3000);
    };
    var boundedFetch = function () {
      var opts = { cache: 'no-store', headers: { 'X-Setup-Watcher': '1' } };
      if (!window.AbortController) return fetch('/status', opts);
      var ctl = new AbortController();
      opts.signal = ctl.signal;
      var timer = setTimeout(function () { ctl.abort(); }, 1500);
      return fetch('/status', opts).then(function (r) {
        clearTimeout(timer);
        return r;
      }, function (err) {
        clearTimeout(timer);
        throw err;
      });
    };
    // After the hand-off: the hotspot answering again means it was re-raised
    // (the join failed, or a new session) unless the state is still the
    // 20 ms "joining" window; reload into the picker the server renders.
    var watchForReturn = function () {
      boundedFetch().then(function (r) {
        if (!r.ok) { setTimeout(watchForReturn, 3000); return; }
        return r.json().then(function (st) {
          if (st && st.state === 'joining') { setTimeout(watchForReturn, 3000); return; }
          window.location.reload();
        });
      }).catch(function () {
        setTimeout(watchForReturn, 3000);
      });
    };
    var poll = function () {
      if (handedOff || inflight) return;
      inflight = true;
      boundedFetch().then(function (r) {
        inflight = false;
        misses = 0;
        if (!r.ok) { setTimeout(poll, 2000); return; }
        return r.json().then(function (st) {
          if (st && (st.state === 'joining' || st.state === 'succeeded')) {
            handOff();
            return;
          }
          setTimeout(poll, 2000);
        });
      }).catch(function () {
        inflight = false;
        misses += 1;
        if (misses >= 3 && !formTouched()) {
          handOff();
          return;
        }
        setTimeout(poll, 1000);
      });
    };
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !handedOff) poll();
    });
    poll();
  })();
</script>
</body>
</html>
