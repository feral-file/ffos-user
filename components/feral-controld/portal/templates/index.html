<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Computer setup — Choose a Wi-Fi network</title>
<link rel="stylesheet" href="/setup.css">
</head>
<body>
<main>
  <p class="brand">Feral File · Art Computer</p>
  <h1>Choose a Wi-Fi network</h1>

  {{if .LastStatus}}
  <div class="status status-{{.LastStatus.State}}">
    {{.LastStatus.Message}}
  </div>
  {{end}}

  <form class="connect" method="POST" action="/connect">
    {{if .SSIDs}}
    <label for="ssid">Wi-Fi network</label>
    <select id="ssid" name="ssid">
      <option value="" selected disabled>Select a network…</option>
      {{range .SSIDs}}<option value="{{.}}">{{.}}</option>{{end}}
      {{- /* This non-empty sentinel identifies the manual branch. It exceeds
           the maximum SSID length and is converted back to an empty manual
           value server-side, so it cannot collide with a real network. */}}
      <option value="{{.ManualSSIDOption}}" data-manual>Other network…</option>
    </select>

    <div id="manual-entry">
      <label for="ssid-manual">Or type a network name</label>
      <input id="ssid-manual" name="ssid_manual" type="text" autocomplete="off"
             autocapitalize="none" placeholder="Leave empty to use the list above">

      <label class="check" for="hidden">
        <input id="hidden" name="hidden" type="checkbox" value="1">
        <span>This is a hidden network</span>
      </label>
    </div>
    {{else}}
    <label for="ssid-manual">Wi-Fi network</label>
    <input id="ssid-manual" name="ssid_manual" type="text" autocomplete="off"
           autocapitalize="none" placeholder="Network name">

    <label class="check" for="hidden">
      <input id="hidden" name="hidden" type="checkbox" value="1">
      <span>This is a hidden network</span>
    </label>
    {{end}}

    <label for="password">Wi-Fi password</label>
    <div class="pwfield">
      <input id="password" name="password" type="password" autocomplete="off"
             aria-describedby="password-help">
      <button type="button" id="password-toggle" class="pwtoggle"
              aria-pressed="false" aria-label="Show password" hidden>
        {{- /* The icon shows the tap's ACTION, following the majority
             convention (Material/Android, Edge): open eye while concealed
             ("tap to reveal"), slashed eye while revealed. */}}
        <svg id="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" hidden>
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <p id="password-help" class="field-hint">
      Use the password for the selected network—not the setup password.
    </p>

    <button type="submit" class="primary">Connect</button>
  </form>

  <form method="GET" action="/rescan">
    <button type="submit" class="secondary">Network not listed?</button>
  </form>
</main>
<script>
  // Collapse manual entry behind the picker's "Other network…" option.
  // Progressive enhancement: the markup ships fully visible, so a captive
  // mini-browser with scripting disabled keeps today's dual-source form;
  // the server accepts either shape unchanged. The reveal rewrites the
  // label/placeholder copy ("Or type a network name" only reads right when
  // the field sits beside the picker) and applies branch-specific validation.
  // The base HTML deliberately leaves the picker optional so a no-JS phone
  // can submit the always-visible manual field; the server rejects an empty
  // submission in either mode.
  (function () {
    var select = document.getElementById('ssid');
    var manual = document.getElementById('manual-entry');
    var input = document.getElementById('ssid-manual');
    if (!select || !manual || !input) return;
    var label = manual.querySelector('label[for="ssid-manual"]');
    var sync = function (viaChange) {
      var choice = select.options[select.selectedIndex];
      var other = !!choice && choice.hasAttribute('data-manual');
      manual.hidden = !other;
      select.required = !other;
      input.required = other;
      if (other) {
        if (label) label.textContent = 'Network name';
        input.placeholder = "Type the network's name";
        if (viaChange) input.focus();
      } else {
        // A typed name outranks the picker server-side, so a stale value
        // left behind a re-hidden field would silently override the pick.
        input.value = '';
      }
    };
    select.addEventListener('change', function () { sync(true); });
    sync(false);
  })();

  // Show/hide toggle for the Wi-Fi password, an icon-only button. The icon
  // shows the tap's action — open eye while concealed ("tap to reveal"),
  // slashed eye while revealed; aria-label carries the accessible name.
  // Progressive enhancement: the button ships [hidden] so a captive
  // mini-browser with scripting disabled just gets a plain password field.
  (function () {
    var input = document.getElementById('password');
    var toggle = document.getElementById('password-toggle');
    var eye = document.getElementById('pw-eye');
    var eyeOff = document.getElementById('pw-eye-off');
    if (!input || !toggle || !eye || !eyeOff) return;
    toggle.hidden = false;
    // Attribute API, not the .hidden property: the icons are SVG elements,
    // and `hidden` is an HTMLElement property — on an SVGElement assigning
    // it creates an inert expando and the attribute never changes.
    var show = function (el, on) {
      if (on) { el.removeAttribute('hidden'); } else { el.setAttribute('hidden', ''); }
    };
    toggle.addEventListener('click', function () {
      var reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      show(eye, !reveal);
      show(eyeOff, reveal);
      toggle.setAttribute('aria-pressed', reveal ? 'true' : 'false');
      toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    });
  })();
</script>
</body>
</html>
