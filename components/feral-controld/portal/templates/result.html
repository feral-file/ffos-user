<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF1 Setup — Connecting…</title>
<style>
  /* Shares the FF1 setup design language with index.html (dark-only,
     monochrome, letterspaced micro-labels); keep the two in sync. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Helvetica Neue", Arial, sans-serif;
    background: #0a0a0b;
    color: #f5f5f6;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 26rem; margin: 0 auto; padding: 2.25rem 1.5rem 3.5rem; }
  .brand {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #8a8a90;
  }
  h1 {
    margin: 1.75rem 0 0.75rem;
    font-size: 1.55rem;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .note {
    margin-top: 1.25rem;
    padding: 0.9rem 1rem;
    font-size: 0.92rem;
    border: 1px solid #1e3a5f;
    background: #131315;
    color: #a8c7fa;
  }
  .note strong { color: #f5f5f6; font-weight: 600; }
  a.action {
    display: block;
    margin-top: 1.75rem;
    padding: 1rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-align: center;
    text-decoration: none;
    color: #0a0a0b;
    background: #f5f5f6;
    border-radius: 2px;
  }
  a.action:active { background: #c9c9ce; }
</style>
</head>
<body>
<main>
  <p class="brand">Feral File · FF1</p>
  <h1>Connecting to {{.SSID}}</h1>
  <p class="note">
    The frame is switching to your Wi-Fi network. <strong>Watch the frame's
    screen</strong> — it will show its progress. You can close this page.
  </p>
  <p class="note">
    If the connection fails, the frame reopens its setup Wi-Fi
    (<strong>{{.APSSID}}</strong>): scan the QR code on its screen again to
    retry.
  </p>
</main>
</body>
</html>
