name: Lint Controld

on:
  push:
    branches: [release, develop]
    paths:
      - 'components/feral-controld/**/*.go'
      - 'components/feral-controld/**/*.html'
      - 'components/feral-controld/**/*.woff2'
      - 'components/feral-controld/**/*.css'
      - '.golangci.yml'
      - 'Makefile'
      - 'components/Makefile'
      - 'components/feral-controld/go.mod'
      - 'components/feral-controld/go.sum'
      - 'components/feral-controld/config.example.json'
  pull_request:
    paths:
      - 'components/feral-controld/**/*.go'
      - 'components/feral-controld/**/*.html'
      - 'components/feral-controld/**/*.woff2'
      - 'components/feral-controld/**/*.css'
      - '.golangci.yml'
      - 'Makefile'
      - 'components/Makefile'
      - 'components/feral-controld/go.mod'
      - 'components/feral-controld/go.sum'
      - 'components/feral-controld/config.example.json'

permissions:
  contents: read

concurrency:
  group: lint-controld-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint feral-controld (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: components/feral-controld/go.sum

      - name: Install golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Run local verification target
        env:
          GO_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # The component's local default names develop. Detached CI checkouts
        # must compare the actual PR/push base, including release hotfixes.
        run: make verify-feral-controld-lint GOLANGCI_LINT_FLAGS="--new-from-merge-base=$GO_LINT_BASE"
