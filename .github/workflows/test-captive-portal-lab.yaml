name: Test captive portal lab

on:
  push:
    branches: [develop, release]
    paths:
      - 'scripts/captive-portal-lab.py'
      - 'scripts/test-captive-portal-lab.py'
      - 'scripts/test-captive-portal-network.py'
      - 'scripts/fixtures/captive-portal/**'
      - 'components/feral-controld/portal/**'
      - 'components/feral-controld/go.mod'
      - 'components/feral-controld/go.sum'
      - '.github/workflows/test-captive-portal-lab.yaml'
  pull_request:
    paths:
      - 'scripts/captive-portal-lab.py'
      - 'scripts/test-captive-portal-lab.py'
      - 'scripts/test-captive-portal-network.py'
      - 'scripts/fixtures/captive-portal/**'
      - 'components/feral-controld/portal/**'
      - 'components/feral-controld/go.mod'
      - 'components/feral-controld/go.sum'
      - '.github/workflows/test-captive-portal-lab.yaml'

permissions:
  contents: read

concurrency:
  group: captive-portal-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B scripts/test-captive-portal-lab.py -v

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: components/feral-controld/go.sum
      - name: Install namespace test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 util-linux
      - name: Build the production portal fixture
        working-directory: components/feral-controld
        env:
          CGO_ENABLED: '0'
        run: go build -o "$RUNNER_TEMP/portal-fixture" ../../scripts/fixtures/captive-portal/main.go
      - name: Exercise interception and recovery in isolated namespaces
        run: sudo python3 -B scripts/test-captive-portal-network.py --portal-fixture "$RUNNER_TEMP/portal-fixture"
