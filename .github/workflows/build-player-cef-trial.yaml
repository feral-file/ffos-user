name: Build FF1 CEF trial
on:
  push:
    branches: ['codex/**']
    paths:
      - 'components/player/src/cef*.cpp'
      - 'components/player/include/ff/cef*.hpp'
      - 'components/player/tools/build-cef-trial.sh'
      - '.github/workflows/build-player-cef-trial.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ff-native-build components/player
      - run: docker run --rm -v "$PWD/components/player:/src" ff-native-build sh tools/build-cef-trial.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ff-player-cef-linux-x86_64
          path: components/player/build-cef-trial/ff-player-cef-linux.tar.gz
          if-no-files-found: error
