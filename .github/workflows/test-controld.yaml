name: Test Controld

on:
  pull_request:
    paths:
      - 'components/feral-controld/**/*.go'
      - 'components/feral-controld/**/*.html'
      - 'components/feral-controld/**/*.woff2'
      - 'components/feral-controld/**/*.css'
      - '.golangci.yml'
      - 'Makefile'
      - 'components/Makefile'
      - 'components/feral-controld/go.mod'
      - 'components/feral-controld/go.sum'
      - 'components/feral-controld/config.example.json'
  workflow_call:
    inputs:
      coverage-pr:
        description: 'Open staging promotion for this exact develop SHA'
        type: string
        default: ''
      upload-coverage:
        description: 'Whether to upload coverage results'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: test-controld-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test feral-controld (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: components/feral-controld/go.sum

      - name: Run local verification target
        run: make verify-feral-controld-test
        env:
          FFOS_REQUIRE_LOG_BROWSER: "1"

      - name: Build the headless host for protocol coverage
        if: ${{ inputs.upload-coverage == true }}
        working-directory: ./components/feral-display
        run: |
          python3 tools/fetch-dependencies.py --core-only
          cmake -S . -B "$RUNNER_TEMP/display-core"
          cmake --build "$RUNNER_TEMP/display-core" --target ff-player-core --parallel 2

      - name: Generate coverage
        if: ${{ inputs.upload-coverage == true }}
        working-directory: ./components/feral-controld
        env:
          FF_NATIVE_CORE: ${{ runner.temp }}/display-core/ff-player-core
        run: |
          # Include calls across package boundaries, including real socket traffic.
          mapfile -t packages < <(go list ./... | grep -vE '/mocks|/wrapper')
          cover_packages=$(IFS=,; echo "${packages[*]}")
          go test -coverprofile="$RUNNER_TEMP/controld.cover" -covermode=atomic -coverpkg="$cover_packages" "${packages[@]}"
          # Each test binary writes a counter for every instrumented block.
          # Sum matching counters once to keep the uploaded profile compact.
          awk 'NR == 1 { print; next } { hits[$1 " " $2] += $3 } END { for (block in hits) print block, hits[block] }' \
            "$RUNNER_TEMP/controld.cover" > coverage.out

      - name: Upload coverage to Codecov
        if: ${{ inputs.upload-coverage == true }}
        uses: codecov/codecov-action@v5
        with:
          files: ./components/feral-controld/coverage.out
          directory: ./components/feral-controld
          slug: feral-file/ffos-user
          flags: feral-controld
          name: feral-controld-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          override_pr: ${{ inputs.coverage-pr }}
          override_branch: ${{ github.ref_name }}
          override_build: ${{ github.run_id }}-controld
